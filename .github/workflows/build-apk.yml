# Builds the TF Contacts Android app (APK) on GitHub's servers.
# Runs by itself on every change, or by hand from the Actions tab ("Run workflow").
# The finished APK is put on the Releases page (tag: latest).
name: Build TF Contacts APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'signing/**'

permissions:
  contents: write

concurrency:
  group: tf-contacts-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare the signing key (same key every time, so updates install over the old app)
        env:
          PASS: ${{ secrets.TF_KEY_PASSWORD }}
        run: |
          if [ -z "$PASS" ]; then
            echo "::warning::Secret TF_KEY_PASSWORD is missing - the code will be checked, but no APK will be published."
            echo "NO_KEY=1" >> "$GITHUB_ENV"
            exit 0
          fi
          KS=signing/tf-contacts.p12
          if [ ! -f "$KS" ]; then
            mkdir -p signing
            keytool -genkeypair -storetype PKCS12 -keystore "$KS" -alias tfcontacts \
              -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=TF Contacts, O=Taiful, C=BD"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$KS"
            git commit -m "Add app signing key (locked with the TF_KEY_PASSWORD secret)"
            git push
          fi
          keytool -list -keystore "$KS" -storetype PKCS12 -storepass "$PASS" -alias tfcontacts > /dev/null \
            || { echo "::error::TF_KEY_PASSWORD does not open signing/tf-contacts.p12"; exit 1; }
          echo "TF_KEYSTORE=$GITHUB_WORKSPACE/$KS" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          TF_KEY_PASSWORD: ${{ secrets.TF_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -Pvc=${{ github.run_number }} --no-daemon --stacktrace
          ls -la app/build/outputs/apk/release/
          if [ -z "$NO_KEY" ]; then cp app/build/outputs/apk/release/app-release.apk TF-Contacts.apk; fi

      - name: Stop if the signing password is not set yet
        if: env.NO_KEY == '1'
        run: |
          echo "::error::The app compiled fine, but the secret TF_KEY_PASSWORD is not set, so no APK was published."
          exit 1

      - name: Keep the APK as a build file
        uses: actions/upload-artifact@v4
        with:
          name: TF-Contacts-apk
          path: TF-Contacts.apk

      - name: Publish the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TF-Contacts.apk \
            --title "TF Contacts — Android app (build ${{ github.run_number }})" \
            --notes "ফোনে ইনস্টল করতে TF-Contacts.apk ফাইলটি ডাউনলোড করে খুলুন। (Build ${{ github.run_number }})"
